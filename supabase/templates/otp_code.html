<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Baylo Agustino code</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #ede3d0;
      font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #ede3d0"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="width: 480px; max-width: 100%; border-collapse: collapse"
          >
            <!-- Ribbon header -->
            <tr>
              <td
                align="center"
                style="
                  background-color: #cc0000;
                  border: 1.5px solid #131010;
                  border-bottom: none;
                  padding: 10px 16px;
                "
              >
                <span
                  style="
                    font-family: Consolas, 'Courier New', monospace;
                    font-size: 11px;
                    font-weight: 600;
                    letter-spacing: 3px;
                    text-transform: uppercase;
                    color: #fbf7ef;
                  "
                >
                  University of San Agustin
                </span>
              </td>
            </tr>

            <!-- Hard-shadow wrapper: ink background peeking out bottom-right -->
            <tr>
              <td style="background-color: #131010; padding: 0 3px 3px 0">
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="border-collapse: collapse"
                >
                  <tr>
                    <td
                      style="
                        background-color: #fbf7ef;
                        border: 1.5px solid #131010;
                        padding: 32px 32px 28px;
                      "
                    >
                      <!-- Wordmark -->
                      <div
                        style="
                          font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
                          font-size: 28px;
                          font-weight: 800;
                          letter-spacing: -0.02em;
                          color: #131010;
                          margin: 0 0 20px;
                        "
                      >
                        Baylo<span style="color: #cc0000">.</span>
                      </div>

                      <p
                        style="
                          font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
                          font-size: 15px;
                          color: #131010;
                          margin: 0 0 4px;
                        "
                      >
                        Your Baylo Agustino code
                      </p>
                      <p
                        style="
                          font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
                          font-size: 13px;
                          color: #4a4340;
                          margin: 0 0 24px;
                        "
                      >
                        Enter this in the app to log in.
                      </p>

                      <!-- Code chit -->
                      <table
                        role="presentation"
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        style="border-collapse: collapse; margin-bottom: 20px"
                      >
                        <tr>
                          <td
                            align="center"
                            style="
                              background-color: #ede3d0;
                              border: 1.5px solid #131010;
                              padding: 18px 12px;
                            "
                          >
                            <span
                              style="
                                font-family: Consolas, 'Courier New', monospace;
                                font-size: 36px;
                                font-weight: 700;
                                letter-spacing: 0.3em;
                                color: #131010;
                              "
                            >
                              {{ .Token }}
                            </span>
                          </td>
                        </tr>
                      </table>

                      <p
                        style="
                          font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
                          font-size: 12px;
                          color: #7c7370;
                          margin: 0;
                        "
                      >
                        Expires in 1 hour. Didn't request this? Ignore this email.
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>

          <p
            style="
              font-family: Consolas, 'Courier New', monospace;
              font-size: 10px;
              letter-spacing: 0.1em;
              text-transform: uppercase;
              color: #7c7370;
              margin: 16px 0 0;
            "
          >
            Baylo Agustino &middot; sa sulod lang sang campus
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
